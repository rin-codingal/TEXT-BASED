<!DOCTYPE html>
<html>
    <head>        
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">        
        <title>Calculator</title>
    </head>
    <body>
        <h1>Simple Calculator</h1>
        <p>Perform all Operations using JavaScript</p>
        <p id="result1"></p>
        <p id="result2"></p>
        <p id="result3"></p>
        <p id="result4"></p>

        <script>
            var num1 = 10;
            var num2 = 2;
            var add = num1 + num2;
            var sub = num1 - num2;
            var mul = num1 * num2;
            var div = num1 / num2;
            
            document.getElementById("result1").innerHTML = "The added value is: " + add;
            document.getElementById("result2").innerHTML = "The subtracted value is: " + sub;
            document.getElementById("result3").innerHTML = "The multiplied value is: " + mul;
            document.getElementById("result4").innerHTML = "The divided value is: " + div;
        </script>
    </body>
</html>
